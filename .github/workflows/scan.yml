name: Scan OdKarla.cz

on:
  schedule:
    # Záloha k externímu cronu. Nepoužívej celé/půlhodiny,
    # tam je fronta GitHubu nejdelší.
    - cron: "23 8-21 * * *"
      timezone: "Europe/Prague"
  workflow_dispatch: {}

# Když se nahromadí zpožděné běhy, ať se nespustí přes sebe.
concurrency:
  group: scan-odkarla
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Zavolat /api/scan na Vercelu
        run: |
          code=$(curl -sS -X POST "${{ secrets.VERCEL_URL }}/api/scan" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -o /tmp/out.txt -w "%{http_code}")
          echo "HTTP status: $code"
          cat /tmp/out.txt
          # Nenech job "zezelenat", když endpoint vrátí 4xx/5xx
          [ "$code" -lt 400 ]
